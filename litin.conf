# /etc/litin/litin.conf
# Global Litin daemon configuration.
# All fields are optional — defaults are shown.

# Directory from which service definitions are loaded.
# services_dir="/etc/litin/services"

# Directory containing target definitions.
# targets_dir="/etc/litin/targets"

# Directory containing socket unit files.
# sockets_dir="/etc/litin/sockets"

# Directory containing timer unit files.
# timers_dir="/etc/litin/timers"

# Directory for masked service markers.
# masks_dir="/etc/litin/masks"

# Path to the litind control socket.
# socket_path="/run/litin/litind.sock"

# Directory for per-service log files.
# log_dir="/var/log/litin"

# Maximum log file size before rotation (in bytes). Default: 10 MiB.
# log_max_bytes="10485760"

# Number of rotated log generations to keep. Default: 3.
# log_keep="3"

# Default target to start on boot.
# default_target="default"

# Whether to enable cgroup v2 per-service isolation.
# cgroup_enabled="true"

# Root path for Litin cgroups under cgroup v2.
# cgroup_root="/sys/fs/cgroup/litin"